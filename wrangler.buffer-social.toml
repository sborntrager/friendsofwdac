name = "friendsofwdac-buffer-social"
main = "workers/buffer-social/src/index.js"
compatibility_date = "2026-10-29"
workers_dev = false
account_id = "bae208b2f47b7699b7bb53fd6bb589fb"

# This Worker is intentionally separate from workers/subscribe.js. Deploy it
# with: npx wrangler deploy --config wrangler.buffer-social.toml
#
# Before deployment, create the D1 database and R2 bucket in the Friends of
# WDAC Cloudflare account, then replace the two values below. The D1 database
# must also contain cloudflare-magic-link-auth's auth_users and auth_sessions
# tables because the Buffer module uses those roles and sessions.
[[d1_databases]]
binding = "DB"
database_name = "friendsofwdac-admin"
database_id = "a6756294-1c90-417e-8f50-50fd682f33ac"
migrations_dir = "workers/buffer-social/migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "replace-with-friendsofwdac-social-media"

[vars]
# Must match APP_ORIGIN in wrangler.auth.toml: the auth cookie is host-only.
APP_ORIGIN = "https://friendsofwdac.org"
BUFFER_ORGANIZATION_ID = "replace-with-buffer-organization-id"
PUBLIC_MEDIA_BASE_URL = "https://replace-with-public-media-domain"
MAX_MEDIA_BYTES = "10485760"
BUFFER_TIMEOUT_MS = "10000"
