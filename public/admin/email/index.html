<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Email Workspace - Friends of WDAC Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/site_v4.css" />
  <link rel="stylesheet" href="../../assets/subpage-page.css" />
  <link rel="stylesheet" href="../../assets/admin-page.css" />
  <link rel="stylesheet" href="../../assets/admin-email.css" />
</head>
<body class="v4-option subpage-page admin-page admin-email-page">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="page">
    <div class="card-shell">
      <header class="top-bar shared-site-top-bar admin-shared-header" data-site-header data-root="../.."></header>

      <main id="main" data-admin-api-base="https://api.friendsofwdac.org/admin">
        <header class="admin-dashboard-header">
          <div class="admin-shell admin-dashboard-header__inner">
            <a class="admin-brand" href="../../index.html" aria-label="Friends of WDAC home">
              <img class="admin-brand__logo" src="../../assets/logo/hLogo.png" alt="Friends of WDAC logo" />
            </a>

            <div class="admin-dashboard-header__actions">
              <a class="admin-header-link" href="../newsletter/index.html">Newsletter workspace</a>
              <button class="admin-outline-btn admin-outline-btn--compact" id="admin-email-refresh" type="button">Refresh mailbox</button>
              <button class="admin-outline-btn admin-outline-btn--compact" id="admin-email-logout" type="button">Log out</button>
            </div>
          </div>

          <nav class="admin-dashboard-nav" aria-label="Admin sections">
            <div class="admin-shell admin-dashboard-nav__inner">
              <a class="admin-dashboard-nav__item" href="../index.html#admin-operations-hero">
                <span class="admin-dashboard-nav__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <rect x="4" y="5" width="16" height="14" rx="2" />
                    <path d="M8 10h8" />
                    <path d="M8 14h5" />
                  </svg>
                </span>
                <span>Dashboard</span>
              </a>
              <a class="admin-dashboard-nav__item" href="../newsletter/index.html">
                <span class="admin-dashboard-nav__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <rect x="3" y="5" width="18" height="14" rx="2" />
                    <path d="m5.5 8 6.5 5 6.5-5" />
                  </svg>
                </span>
                <span>Newsletter</span>
              </a>
              <a class="admin-dashboard-nav__item is-active" href="./index.html">
                <span class="admin-dashboard-nav__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <path d="M4 6h16v12H4z" />
                    <path d="m4 8 8 5 8-5" />
                  </svg>
                </span>
                <span>Email</span>
              </a>
            </div>
          </nav>
        </header>

        <section class="admin-email-root">
          <div class="admin-shell">
            <p class="admin-email-note" id="admin-email-note" role="status" aria-live="polite" hidden></p>
          </div>

          <div class="admin-shell admin-email-layout">
            <aside class="admin-email-panel admin-email-panel--sidebar" aria-label="Email folders">
              <button class="admin-primary-btn admin-primary-btn--full" id="admin-email-compose-open" type="button">New message</button>

              <div class="admin-email-status-card">
                <h2>Email status</h2>
                <dl>
                  <div>
                    <dt>Connection</dt>
                    <dd id="admin-email-zoho-status">Checking...</dd>
                  </div>
                  <div>
                    <dt>Mailbox</dt>
                    <dd id="admin-email-mailbox">Loading...</dd>
                  </div>
                  <div>
                    <dt>Sender</dt>
                    <dd id="admin-email-sender">Loading...</dd>
                  </div>
                </dl>
                <button class="admin-outline-btn admin-outline-btn--compact" id="admin-email-connect" type="button">Connect Zoho</button>
                <p class="admin-email-status-hint" id="admin-email-scope-hint" hidden></p>
              </div>

              <div class="admin-email-folder-wrap">
                <h2>Folders</h2>
                <ul class="admin-email-folder-list" id="admin-email-folders"></ul>
              </div>
            </aside>

            <section class="admin-email-panel admin-email-panel--list" aria-label="Message list">
              <header class="admin-email-list-toolbar">
                <label for="admin-email-search" class="sr-only">Search messages</label>
                <input class="admin-text-input" id="admin-email-search" type="search" placeholder="Search subject or sender" />
                <button class="admin-outline-btn admin-outline-btn--compact" id="admin-email-search-button" type="button">Search</button>
              </header>

              <div class="admin-email-message-list" id="admin-email-messages"></div>
            </section>

            <section class="admin-email-panel admin-email-panel--reader" aria-label="Message reader">
              <div class="admin-email-reader-empty" id="admin-email-reader-empty">
                <h2>Select a message</h2>
                <p>Choose any message from the list to preview and reply.</p>
                <div class="admin-action-row">
                  <button class="admin-primary-btn admin-primary-btn--compact" id="admin-email-compose-open-empty" type="button">Create new email</button>
                </div>
              </div>

              <article class="admin-email-reader" id="admin-email-reader" hidden>
                <header class="admin-email-reader-head">
                  <h2 id="admin-email-reader-subject">Message subject</h2>
                  <p id="admin-email-reader-meta"></p>
                  <div class="admin-email-reader-actions">
                    <button class="admin-outline-btn admin-outline-btn--compact" id="admin-email-mark-read" type="button">Mark read</button>
                    <button class="admin-outline-btn admin-outline-btn--compact" id="admin-email-mark-unread" type="button">Mark unread</button>
                  </div>
                </header>

                <div class="admin-email-reader-content" id="admin-email-reader-content"></div>
                <ul class="admin-email-attachment-list" id="admin-email-attachments"></ul>

                <form class="admin-email-reply-form" id="admin-email-reply-form">
                  <label for="admin-email-reply-to">Reply to</label>
                  <input class="admin-text-input" id="admin-email-reply-to" type="text" required />

                  <label for="admin-email-reply-subject">Subject</label>
                  <input class="admin-text-input" id="admin-email-reply-subject" type="text" required />

                  <label for="admin-email-reply-body">Reply message</label>
                  <textarea class="admin-textarea" id="admin-email-reply-body" rows="6" required></textarea>

                  <div class="admin-action-row">
                    <button class="admin-primary-btn" type="submit">Send reply</button>
                  </div>
                </form>
              </article>
            </section>
          </div>
        </section>

        <section class="admin-email-compose" id="admin-email-compose" hidden>
          <div class="admin-email-compose__backdrop" id="admin-email-compose-close"></div>
          <form class="admin-email-compose__card" id="admin-email-compose-form">
            <h2>Compose email</h2>

            <label for="admin-email-compose-to">To</label>
            <input class="admin-text-input" id="admin-email-compose-to" type="text" placeholder="name@example.com" required />

            <label for="admin-email-compose-cc">Cc</label>
            <input class="admin-text-input" id="admin-email-compose-cc" type="text" placeholder="optional@example.com" />

            <label for="admin-email-compose-bcc">Bcc</label>
            <input class="admin-text-input" id="admin-email-compose-bcc" type="text" placeholder="optional@example.com" />

            <label for="admin-email-compose-subject">Subject</label>
            <input class="admin-text-input" id="admin-email-compose-subject" type="text" required />

            <label for="admin-email-compose-body">Message</label>
            <textarea class="admin-textarea" id="admin-email-compose-body" rows="9" required></textarea>

            <div class="admin-action-row">
              <button class="admin-primary-btn" type="submit">Send email</button>
              <button class="admin-outline-btn" id="admin-email-compose-cancel" type="button">Cancel</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </div>

  <script src="../../js/site.js" defer></script>
  <script src="../../js/admin-email.js" defer></script>
</body>
</html>
