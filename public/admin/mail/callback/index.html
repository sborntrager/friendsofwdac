<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Connecting Zoho Mail...</title>
  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: #17384f;
      background: #f4f8fc;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
    }
    .card {
      max-width: 560px;
      background: #fff;
      border: 1px solid rgba(15, 92, 134, 0.14);
      border-radius: 12px;
      padding: 22px 24px;
      box-shadow: 0 10px 28px rgba(20, 54, 82, 0.12);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.2;
    }
    p {
      margin: 0;
      line-height: 1.6;
    }
    a {
      color: #0f5c86;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Completing Zoho connection...</h1>
    <p id="status">Forwarding securely to the app callback endpoint.</p>
    <p style="margin-top:12px;">
      If nothing happens, <a id="manual-link" href="#">continue manually</a>.
    </p>
  </main>

  <script>
    (function () {
      var query = window.location.search || "";
      var target = "https://friendsofwadc-subscribe.shannonborntrager.workers.dev/admin/mail/callback" + query;
      var link = document.getElementById("manual-link");
      if (link) link.href = target;
      window.location.replace(target);
    })();
  </script>
</body>
</html>
