<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stay Connected - Friends of WDAC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/site_v4.css" />
  <style>
    :root {
      --bg-image: url("assets/hero-pool.png");
      --overlay-top: rgba(7, 12, 20, 0.72);
      --overlay-bottom: rgba(7, 12, 20, 0.12);
      --text: #f8fafc;
      --muted: rgba(248, 250, 252, 0.72);
      --panel: rgba(9, 14, 24, 0.32);
      --border: rgba(248, 250, 252, 0.12);
      --radius: 20px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body.page {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      background: #0b1220;
      position: relative;
      overflow-x: hidden;
    }

    body.page::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      z-index: -2;
    }

    body.page::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(180deg, var(--overlay-top), var(--overlay-bottom)),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.02) 1px, rgba(0, 0, 0, 0.02) 2px);
      opacity: 1;
      z-index: -1;
      pointer-events: none;
    }

    .wrap {
      min-height: calc(100vh - 112px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(36px, 8vw, 96px) clamp(24px, 6vw, 72px);
    }

    .brand {
      margin-bottom: 32px;
    }

    .brand-logo {
      width: min(380px, 84vw);
      height: auto;
      display: block;
      filter: drop-shadow(0 16px 26px rgba(0, 0, 0, 0.34));
    }

    .content {
      max-width: 720px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(24px, 6vw, 48px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
    }

    .headline {
      margin: 0 0 12px;
      font-size: clamp(36px, 6vw, 64px);
      letter-spacing: 0;
    }

    .subhead {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 20px);
    }

    .form {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
    }

    .input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      padding: 12px 18px;
      color: var(--text);
      font-size: 15px;
    }

    .input::placeholder {
      color: rgba(248, 250, 252, 0.6);
    }

    .button {
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      background: #f45b5b;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(244, 91, 91, 0.35);
    }

    .form-note {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }

    .meta {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .meta a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid rgba(248, 250, 252, 0.3);
    }

    .footer a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid rgba(248, 250, 252, 0.3);
    }

    .footer-admin {
      margin-top: 10px;
    }

    .splash-page .footer {
      align-self: flex-start;
      width: auto;
      margin-top: auto;
      padding: 32px 0 0 !important;
      font-size: 12px;
      color: var(--muted);
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .input:focus-visible,
    .button:focus-visible,
    .meta a:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.8);
      outline-offset: 2px;
    }

    @media (max-width: 720px) {
      .wrap {
        min-height: calc(100vh - 132px);
      }

      .field-row {
        grid-template-columns: 1fr;
      }

      .button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
